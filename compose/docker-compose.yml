name: nestbox

services:
  # Named volumes are created as root.  The controller is deliberately
  # unprivileged (uid 10001), so initialise its writable state once.
  init-data:
    image: alpine:3.21
    restart: "no"
    command: ["sh", "-c", "chown -R 10001:10001 /var/lib/nestbox"]
    volumes:
      - data:/var/lib/nestbox

  # The published OpenShell image runs as uid 1000.  Its Docker supervisor is
  # later bind-mounted by the daemon, so use a host path and initialise it here.
  init-openshell:
    image: alpine:3.21
    profiles: ["runtime"]
    restart: "no"
    command: ["sh", "-c", "chown -R 1000:1000 /var/lib/openshell"]
    volumes:
      - /var/lib/openshell:/var/lib/openshell

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nestbox
      POSTGRES_USER: nestbox
      POSTGRES_PASSWORD: ${NESTBOX_DB_PASSWORD:-nestbox}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  controller:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: images/controller/Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      NESTBOX_SECRET_KEY: ${NESTBOX_SECRET_KEY:-dev-only}
      NESTBOX_DB_HOST: db
      NESTBOX_DB_PASSWORD: ${NESTBOX_DB_PASSWORD:-nestbox}
      NESTBOX_BOOTSTRAP_ADMIN_EMAIL: ${NESTBOX_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      NESTBOX_BOOTSTRAP_ADMIN_PASSWORD: ${NESTBOX_BOOTSTRAP_ADMIN_PASSWORD:-change-me}
      NESTBOX_OPENSHELL_ADAPTER: ${NESTBOX_OPENSHELL_ADAPTER:-auto}
      NESTBOX_OPENSHELL_ENDPOINT: ${NESTBOX_OPENSHELL_ENDPOINT:-http://gateway:8080}
    group_add:
      - "${NESTBOX_DOCKER_GID:-999}"
    ports:
      - "${NESTBOX_UI_PORT:-443}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - data:/var/lib/nestbox
      - /etc/nestbox:/etc/nestbox:ro
    depends_on:
      db:
        condition: service_healthy
      init-data:
        condition: service_completed_successfully

  # The official OpenShell container gateway.  Keep this behind the `runtime`
  # profile so controller-only development remains fast and works offline.
  # Start the complete local runtime with:
  #   docker compose --profile runtime up -d --build
  gateway:
    image: ${OPENSHELL_GATEWAY_IMAGE:-ghcr.io/nvidia/openshell/gateway:latest}
    profiles: ["runtime"]
    restart: unless-stopped
    group_add:
      - "${NESTBOX_DOCKER_GID:-999}"
    depends_on:
      init-openshell:
        condition: service_completed_successfully
    environment:
      HOME: /var/lib/openshell
      XDG_STATE_HOME: /var/lib/openshell
      OPENSHELL_COMPUTE_DRIVER: docker
      OPENSHELL_DOCKER_SOCKET: /var/run/docker.sock
      OPENSHELL_DB_URL: sqlite:/var/lib/openshell/openshell.db
      OPENSHELL_DISABLE_TLS: "true"
      OPENSHELL_SERVER_PORT: "8080"
    ports:
      # Do not remap this port: OpenShell sandboxes call the gateway back on it.
      - "${OPENSHELL_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.openshell.internal:host-gateway"
    volumes:
      # OpenShell's supervisor is bind-mounted by the Docker daemon.  The path
      # must therefore be identical inside this container and on the host.
      - /var/lib/openshell:/var/lib/openshell
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  db:
  data:
