[project]
name = "nestbox"
version = "0.1.0"
description = "One-boot AI appliance: OpenShell sandboxes, policies and a web UI."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Matthias Binder" }]
dependencies = [
  "django>=5.1,<5.3",
  "djangorestframework>=3.15",
  "drf-spectacular>=0.27",
  "django-allauth[mfa]>=65",
  "django-otp>=1.5",
  "django-axes>=7",
  "whitenoise>=6.7",
  "django-unfold>=0.40",
  "docker>=7",
  "pyyaml>=6",
  "argon2-cffi>=23",
  "cryptography>=43",
  "psycopg[binary]>=3.2",
  "celery>=5.4",
  "redis>=5",
  "gunicorn>=22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-django>=4.9",
  "ruff>=0.6",
  "mypy>=1.11",
  "django-stubs>=5",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF012", "RUF100", "B007"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["controlplane"]
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["controlplane/tests"]
