{% load i18n static %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% translate "Sign out" %} — Nestbox</title>
  <link rel="icon" href="{% static 'img/icon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <a class="auth-brand" href="{% url 'dashboard' %}">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.75" y="3.75" width="16.5" height="16.5" rx="4" stroke="var(--nb-primary)" stroke-width="1.5"/>
        <rect x="7.25" y="7.25" width="9.5" height="9.5" rx="2.5" stroke="var(--nb-primary)" stroke-width="1.25" opacity=".65"/>
        <rect x="10" y="10" width="4" height="4" rx="1" fill="var(--nb-accent)"/>
      </svg>
      <span>Nestbox</span>
    </a>
    <section class="auth-card">
      <h1>{% translate "Sign out" %}</h1>
      <p class="auth-hint muted">{% translate "You are about to end this session on the appliance." %}</p>
      <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <button class="btn primary auth-submit" type="submit">{% trans "Sign out" %}</button>
      </form>
      <p class="auth-foot muted"><a href="{% url 'dashboard' %}">{% translate "Back to the dashboard" %}</a></p>
    </section>
  </main>
</body>
</html>
