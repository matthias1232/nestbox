# Throwaway PostgreSQL for the integration test suite.
#
# Deliberately separate from the appliance compose file: a test run must never
# be able to touch the development database.
#
#   docker compose -f docker-compose.test.yml up -d
#   export TEST_DATABASE_URL=postgres://nestbox:test@localhost:55432/nestbox_test
#   cargo test

name: nestbox-test

services:
  postgres-test:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_DB: nestbox_test
      POSTGRES_USER: nestbox
      POSTGRES_PASSWORD: test
    ports:
      # A non-default port so it cannot collide with an appliance on 5432.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestbox -d nestbox_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    # No volume: every test run starts from an empty database, which is what
    # makes the migration path itself part of what is tested.
    tmpfs:
      - /var/lib/postgresql/data
