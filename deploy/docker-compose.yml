services:
  control-api:
    build: ../services/control-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
  web-console:
    build: ../services/web-console
    restart: unless-stopped
    depends_on:
      - control-api
    ports:
      - "8080:80"
  gateway:
    build: ../services/gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
