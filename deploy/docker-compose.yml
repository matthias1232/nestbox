# Nestbox appliance — full stack.
#
# PostgreSQL is the single control store (ADR 0001). It runs locally as a
# container and holds no secret values: credentials live as locators (ADR 0005)
# in the mounted secret directory.
#
# Every image is pinned by digest deliberately. `latest` is rejected by the
# image policy test, and a floating tag would let a registry change the running
# system without a review.

name: nestbox

services:
  # Creates the data and secret directories with the right ownership before the
  # API starts. Runs once and exits.
  init-data:
    image: alpine:3.21
    restart: "no"
    command:
      - sh
      - -c
      - |
        mkdir -p /data/gateway /secrets
        chown -R 10001:10001 /data /secrets
        chmod 0700 /secrets
        find /secrets -type f -exec chmod 0600 {} + 2>/dev/null || true
        echo "data and secret directories prepared"
    volumes:
      - ./data:/data
      - ./secrets:/secrets

  postgres:
    # Pinned by digest in production; the tag is kept for readability.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nestbox
      POSTGRES_USER: nestbox
      # The password is read from a file, never from the compose environment,
      # so it does not appear in `docker inspect` (ADR 0005).
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Fail fast rather than silently initialise a different cluster.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    secrets:
      - postgres_password
    volumes:
      - nestbox-postgres:/var/lib/postgresql/data
      # Creates the least-privilege application role on first initialisation.
      - ./postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestbox -d nestbox"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published on the host: only the API needs it, and a database on a
    # public interface is an unnecessary exposure.
    expose:
      - "5432"
    networks:
      - control

  migrate:
    build:
      context: ../services/control-api-rust
      dockerfile: Dockerfile
    # Runs the migrations and exits. The API waits for this to complete, so a
    # schema change never races the application startup.
    #
    # Migrations connect as the schema owner. The API connects as nestbox_app,
    # which is what makes row-level security apply to it.
    command: ["/usr/local/bin/nestbox-control-api", "migrate"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url_admin
      NESTBOX_BOOTSTRAP_ADMIN: "true"
      RUST_LOG: info
    secrets:
      - database_url_admin
    depends_on:
      postgres:
        condition: service_healthy
      init-data:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - control

  control-api:
    build:
      context: ../services/control-api-rust
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      NESTBOX_RUNNER_URL: http://sandbox-runner:9000
      # The name Compose actually gives the network, not a hand-written one.
      # `nestbox-runtime` and `nestbox_runtime` are two different bridges, and a
      # mismatch puts sandboxes on a network that is not the internal one the
      # proxy and the API are attached to.
      NESTBOX_RUNTIME_NETWORK: ${COMPOSE_PROJECT_NAME:-nestbox}_runtime
      NESTBOX_SECRET_DIR: /secrets
      NESTBOX_SESSION_COOKIE_SECURE: "false"
      RUST_LOG: info,tower_http=warn
    secrets:
      - database_url
    volumes:
      - ./data/gateway:/data/gateway:ro
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      init-data:
        condition: service_completed_successfully
    expose:
      - "8000"
    networks:
      - control
      - runtime

  web-console:
    build:
      context: ../services/web-console-solid
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - control-api
    ports:
      - "8080:8080"
    networks:
      - control

  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./data/gateway:/var/log/nginx
    expose:
      - "8081"
    networks:
      - control

  sandbox-runner:
    build:
      context: ../services/sandbox-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NESTBOX_ALLOWED_IMAGES: ubuntu:24.04,nestbox-ubuntu-dev:local,nestbox-hermes:local,nestbox-openclaw:local,nestbox-tool-git:local
      # See control-api: this must be the Compose network, or the runner creates
      # a second bridge and every sandbox/model lands on the wrong one.
      NESTBOX_RUNTIME_NETWORK: ${COMPOSE_PROJECT_NAME:-nestbox}_runtime
      # Bind mounts for persistent roots come only from this tree.
      NESTBOX_PERSISTENT_BASE: /var/lib/nestbox/persistent
      # The host's /proc, so the hardware report describes the machine.
      NESTBOX_HOST_PROC: /host/proc
      # Model artefacts. The runner fetches them and starts one server
      # container per install; both use this path, inside and out, so the bind
      # source it validates is the directory Docker mounts.
      NESTBOX_MODEL_BASE: /var/lib/nestbox/models
      # The only images a model server may start, by digest (ADR 0022). An
      # image is a dependency with a version, and `latest` is not a version.
      NESTBOX_MODEL_IMAGES: ghcr.io/ggml-org/llama.cpp@sha256:8ee4ec7ce58a921313d07390c6699af13aa5ec083f3cdf67e5f4155767047373
      # A single download may not exceed this, whatever the API asks for.
      NESTBOX_MODEL_MAX_BYTES: "34359738368"
    volumes:
      # The only component that talks to the Docker socket. It is separate from
      # the API on purpose: a compromise of the API does not yield the host.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent roots live here on the host; the same path inside and out
      # so a bind source the runner validates is the path Docker mounts.
      - /var/lib/nestbox/persistent:/var/lib/nestbox/persistent
      - /var/lib/nestbox/models:/var/lib/nestbox/models
      - /proc:/host/proc:ro
    expose:
      - "9000"
    networks:
      - control
      - runtime

  # The only way out of the sandbox network. Envoy asks the control API for a
  # decision per request (default deny, fail closed) and writes one JSON line per
  # request to stdout, which the control API ingests and redacts.
  #
  # It is the one component with NET_ADMIN and NET_RAW, and only for the redirect
  # rules that catch a tool which ignores HTTP_PROXY. It is not published on the
  # host: a forward proxy on a LAN interface with no authentication is an open
  # relay, and the sandboxes reach it over the `runtime` network by service name.
  egress-proxy:
    build:
      context: ../services/egress-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NESTBOX_NODE_NAME: local
      # Where a future CONNECT-termination step reads the node token. Until the
      # proxy authenticates its ingest calls, the value is unused and the file
      # is not mounted, so a missing secret cannot break the stack.
      NESTBOX_NODE_TOKEN_FILE: /run/secrets/node_token
    cap_add:
      - NET_ADMIN
      - NET_RAW
    expose:
      - "3128"
    depends_on:
      - control-api
    # Upstream: `control` (has a default route, reaches the LAN and the internet).
    # Downstream: `runtime` is internal, which is what makes the proxy the only
    # way out for a sandbox.
    networks:
      - control
      - runtime

  tool-image-ubuntu-dev:
    build:
      context: ../services/tool-images/ubuntu-dev
    image: nestbox-ubuntu-dev:local
    profiles: ["build-tools"]

  tool-image-hermes:
    build:
      context: ../services/tool-images/hermes
    image: nestbox-hermes:local
    profiles: ["build-tools"]

  tool-image-openclaw:
    build:
      context: ../services/tool-images/openclaw
    image: nestbox-openclaw:local
    profiles: ["build-tools"]

  tool-image-git:
    build:
      context: ../services/tool-images/git
    image: nestbox-tool-git:local
    profiles: ["build-tools"]

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  database_url_admin:
    file: ./secrets/database_url_admin

volumes:
  nestbox-postgres:

networks:
  # Carries control traffic: browser to console, console to API, API to Postgres.
  control:
    internal: false
  # Carries sandbox traffic and is internal: a sandbox cannot reach the host
  # network directly, only the gateway.
  runtime:
    internal: true
