services:
  control-api:
    build: ../services/control-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      - ./data/gateway:/data/gateway:ro
  web-console:
    build: ../services/web-console
    volumes:
      - ./secrets/web-console.htpasswd:/etc/nginx/secrets/web-console.htpasswd:ro
    restart: unless-stopped
    depends_on:
      - control-api
    ports:
      - "8080:80"
  gateway:
    build: ../services/gateway
    restart: unless-stopped
    volumes:
      - ./data/gateway:/var/log/nginx
    ports:
      - "127.0.0.1:8081:8081"
