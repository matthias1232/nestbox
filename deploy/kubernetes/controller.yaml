apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nestbox-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nestbox-controller
    spec:
      containers:
        - name: controller
          image: CONTROLLER_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: nestbox-controller
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings.prod
---
apiVersion: v1
kind: Service
metadata:
  name: controller
spec:
  selector:
    app.kubernetes.io/name: nestbox-controller
  ports:
    - name: http
      port: 8000
      targetPort: http
