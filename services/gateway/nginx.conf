worker_processes auto; events { worker_connections 4096; }
http { log_format nestbox_json escape=json "{\"time\":\"$time_iso8601\",\"remote\":\"$remote_addr\",\"method\":\"$request_method\",\"host\":\"$host\",\"uri\":\"$uri\",\"status\":$status,\"request_time\":$request_time}"; access_log /var/log/nginx/access.json nestbox_json;
server { listen 8081; server_name _; location /healthz { return 200 "ok\n"; } location / { return 403; } } }
