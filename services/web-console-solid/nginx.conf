# The console and the API are served from one origin.
#
# That is a deliberate security choice: with a single origin there is no CORS
# policy to get wrong, and the session cookie can be SameSite=Lax.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is proxied rather than published, so there is one entry point and
    # one place to add TLS later.
    location /api/ {
        proxy_pass http://control-api:8000/api/;
        proxy_http_version 1.1;

        # Server-sent events must not be buffered, or the live console stops
        # being live.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single-page app: unknown paths render the shell, which shows the login
    # screen or the requested view.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The bundle is content-hashed by Vite, so it can be cached hard. The shell
    # must not be, or a deploy would not be picked up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
