# The console and the API are served from one origin.
#
# That is a deliberate security choice: with a single origin there is no CORS
# policy to get wrong, and the session cookie can be SameSite=Lax.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The terminal is a WebSocket on the same API. nginx needs the upgrade
    # dance and a long read timeout, and it must not send the empty `Connection`
    # header the SSE location below uses — hence a location of its own.
    location ~ ^/api/v1/sandboxes/[0-9a-fA-F-]+/terminal$ {
        proxy_pass http://control-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A terminal is idle-by-design for minutes at a time. The control API
        # closes it after 30 minutes of no input; nginx must not close it first.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # The API is proxied rather than published, so there is one entry point and
    # one place to add TLS later.
    location /api/ {
        proxy_pass http://control-api:8000/api/;
        proxy_http_version 1.1;

        # Server-sent events must not be buffered, or the live console stops
        # being live.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single-page app: unknown paths render the shell, which shows the login
    # screen or the requested view.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell names the content-hashed bundle, so a cached shell keeps an old
    # bundle alive after a deploy. That happened during the first Admin Center
    # rollout: the new code was running, the browser kept asking for the old
    # asset. `no-cache` still revalidates, so an unchanged shell costs a 304.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The bundle is content-hashed by Vite, so it can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
